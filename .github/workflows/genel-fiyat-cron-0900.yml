name: Genel Fiyat Guncelleme (09:00)

on:
  # schedule tetikleyicisi pasif: GitHub Actions'ın "schedule" event'i bu repo için
  # güvenilmez çıktı (bazı günler hiç tetiklenmedi, tetiklendiğinde de saatlerce
  # gecikebiliyordu — bkz. proje notları). Asıl zamanlayıcı artık cron-job.org.
  # Elle çalıştırmak için "workflow_dispatch" (Actions sekmesinden "Run workflow") kaldı.
  workflow_dispatch:

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - name: Tum fiyatlari guncelle (fon+BIST+ABD)
        run: |
          curl -sf "https://yatirim-takip-murat.fly.dev/cron/guncelle?key=${{ secrets.CRON_KEY }}"
