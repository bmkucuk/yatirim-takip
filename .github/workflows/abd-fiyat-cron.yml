name: ABD Borsa Fiyat Guncelleme

on:
  # schedule tetikleyicisi pasif: GitHub Actions'ın "schedule" event'i bu repo için
  # güvenilmez çıktı (2 saate varan gecikmelerle tetiklendi — bkz. proje notları).
  # Asıl zamanlayıcı artık cron-job.org. Elle çalıştırmak için "workflow_dispatch"
  # (Actions sekmesinden "Run workflow") kaldı.
  workflow_dispatch:

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - name: ABD fiyatlarini cek
        run: |
          curl -sf "https://yatirim-takip-murat.fly.dev/cron/abd-guncelle?key=${{ secrets.CRON_KEY }}"
